<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIを使ってみた体験レポート</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(135deg, #fff4e6 0%, #e6f4ff 100%);
    color: #333;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #ff9a8b, #ffb86c);
    padding: 32px 24px;
    text-align: center;
    color: #fff;
  }
  .header .badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12px;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .header h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.4;
  }
  .nickname {
    margin-top: 8px;
    font-size: 15px;
    opacity: 0.95;
  }
  .body {
    padding: 24px;
  }
  .section {
    margin-bottom: 22px;
    padding: 16px;
    border-radius: 14px;
    background: #f9f9fb;
    border-left: 5px solid #ffb86c;
  }
  .section:nth-of-type(2) {
    border-left-color: #6cc7ff;
  }
  .section:nth-of-type(3) {
    border-left-color: #ff8bd0;
  }
  .section:nth-of-type(4) {
    border-left-color: #8ee6a3;
  }
  .section h2 {
    margin: 0 0 8px;
    font-size: 14px;
    color: #888;
    font-weight: 600;
  }
  .section p {
    margin: 0;
    font-size: 16px;
    line-height: 1.7;
    color: #333;
  }
  .emoji {
    font-size: 20px;
    margin-right: 6px;
  }
  .footer {
    text-align: center;
    padding: 18px;
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="badge">AI体験レポート</div>
      <h1>一人でもできた!<br>AI体験レポート</h1>
      <div class="nickname">by なんな</div>
    </div>
    <div class="body">
      <div class="section">
        <h2><span class="emoji">🛠️</span>今日やってみたこと</h2>
        <p>Claude Codeでスプレッドシートに書き込んだ</p>
      </div>
      <div class="section">
        <h2><span class="emoji">😳</span>一番驚いたこと・気づいたこと</h2>
        <p>自分一人でもできた</p>
      </div>
      <div class="section">
        <h2><span class="emoji">🚀</span>これから使ってみたいこと</h2>
        <p>LPとか作れるようになりたい</p>
      </div>
      <div class="section">
        <h2><span class="emoji">💬</span>ひとこと感想</h2>
        <p>不安だったができてよかった</p>
      </div>
    </div>
    <div class="footer">Generated with Claude Code</div>
  </div>
</body>
</html>
